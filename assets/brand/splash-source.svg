<?xml version="1.0" encoding="UTF-8"?>
<!--
  Equilibrium Finance — Launch Splash (logo only)

  Transparent background. The actual splash background color is controlled by
  app.json `expo-splash-screen.backgroundColor` (and the iOS / Android native
  resources prebuild generates from it). Keeping the image transparent means
  the splash automatically tracks the configured theme color, and we never
  see a hairline mismatch between the image's baked-in background and the
  surface color the OS paints behind it.

  Square 1024 canvas — Expo's `resizeMode: contain` will scale-fit it on every
  device, leaving the configured background to fill the rest of the screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="splash-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a0e4fe"/>
      <stop offset="1" stop-color="#66aac2"/>
    </linearGradient>
  </defs>

  <!-- The Equilibrium monogram, centered. Mirrors icon-source.svg geometry but
       slightly more compact so the wordmark below has room. -->
  <g transform="translate(380 280)">
    <!-- Vertical spine -->
    <rect x="120" y="0" width="28" height="440" rx="14" fill="url(#splash-beam)" opacity="0.95"/>
    <!-- Top crossbar (income weight) -->
    <rect x="148" y="40" width="280" height="56" rx="28" fill="#e6ebfc"/>
    <!-- Middle crossbar (equilibrium) -->
    <rect x="148" y="200" width="220" height="56" rx="28" fill="#a0e4fe"/>
    <!-- Bottom crossbar (reserves) -->
    <rect x="148" y="360" width="280" height="56" rx="28" fill="#e6ebfc"/>
  </g>

  <!-- Wordmark beneath the symbol -->
  <text x="512" y="820" text-anchor="middle"
        font-family="Manrope, -apple-system, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1.4"
        fill="#e6ebfc">Equilibrium</text>
  <text x="512" y="868" text-anchor="middle"
        font-family="Manrope, -apple-system, sans-serif"
        font-size="22" font-weight="500" letter-spacing="6"
        fill="#a5abbb">FINANCE</text>
</svg>
